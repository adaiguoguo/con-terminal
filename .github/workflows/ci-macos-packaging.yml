name: macOS packaging fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/ci-macos-packaging.yml'
      - '.github/workflows/release-macos.yml'
      - 'scripts/macos/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-macos-packaging.yml'
      - '.github/workflows/release-macos.yml'
      - 'scripts/macos/**'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax and bundle handoff
        run: |
          set -euo pipefail
          for script in scripts/macos/*.sh; do
            bash -n "$script"
          done
          bash scripts/macos/test-stapler-retry.sh
          bash scripts/macos/test-prebuilt-app.sh
          bash scripts/macos/test-dependencies.sh
      - name: Validate generated Homebrew casks
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew ruby scripts/macos/test-homebrew-cask.rb
